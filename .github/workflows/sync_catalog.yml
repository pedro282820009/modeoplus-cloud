name: ModeoPlus Cloud Catalog Sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: '' # Desactiva explícitamente la búsqueda de requirements.txt

      - name: Instalar dependencias Cloud
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-api-python-client google-auth

      - name: Ejecutar constructor de catálogo y sincronización con Drive
        env:
          GDRIVE_TORRENTS_FOLDER_ID: ${{ secrets.GDRIVE_TORRENTS_FOLDER_ID }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          python cloud_catalog_builder.py

      - name: Guardar modeoplus_catalog.mdx actualizado en GitHub
        run: |
          git config user.name "modeoplus-bot"
          git config user.email "bot@modeoplus.cloud"
          git add modeoplus_catalog.mdx drive_torrents_index.json
          git diff --staged --quiet || git commit -m "Auto-sync catálogo Modeo+ Cloud"
          git push

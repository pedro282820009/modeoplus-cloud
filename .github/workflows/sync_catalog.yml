name: sync-catalog-and-drive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip --break-system-packages || true
          python3 -m pip install requests beautifulsoup4 urllib3 --break-system-packages || pip install requests beautifulsoup4 urllib3

      - name: Run Cloud Catalog Builder (Full Scan + GitHub Vault)
        env:
          GITHUB_REPO_FULL: ${{ github.repository }}
          MAX_PAGES_PER_CATEGORY: "35"
          MAX_NEW_POW_PER_RUN: "450"
        run: |
          if [ -f ".github/cloud_catalog_builder.py" ] && [ ! -f "cloud_catalog_builder.py" ]; then
            mv -f .github/cloud_catalog_builder.py cloud_catalog_builder.py
          fi
          python3 -u cloud_catalog_builder.py

      - name: Commit and Push Updated MDX and Torrents Vault
        run: |
          git config user.name "modeoplus-bot"
          git config user.email "bot@modeoplus.cloud"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-sync catalogo masivo Modeo+ y torrents_vault"
          git push

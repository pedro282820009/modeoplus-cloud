name: sync-catalog-and-drive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip' # This will now successfully look for requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run script
        env:
          GDRIVE_TORRENTS_FOLDER_ID: ${{ secrets.GDRIVE_TORRENTS_FOLDER_ID }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          python cloud_catalog_builder.py

      - name: Commit and push changes
        run: |
          git config user.name "modeoplus-bot"
          git config user.email "bot@modeoplus.cloud"
          git add modeoplus_catalog.mdx drive_torrents_index.json || true
          git diff --staged --quiet || git commit -m "Auto-sync catalog and drive index"
          git push

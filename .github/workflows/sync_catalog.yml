name: sync-catalog-and-drive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip --break-system-packages || true
          python3 -m pip install requests beautifulsoup4 google-api-python-client google-auth urllib3 --break-system-packages || pip install requests beautifulsoup4 google-api-python-client google-auth urllib3

      - name: Move files to root if inside .github and Run script
        env:
          GDRIVE_TORRENTS_FOLDER_ID: ${{ secrets.GDRIVE_TORRENTS_FOLDER_ID }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -f ".github/cloud_catalog_builder.py" ] && [ ! -f "cloud_catalog_builder.py" ]; then
            git mv .github/cloud_catalog_builder.py cloud_catalog_builder.py || cp .github/cloud_catalog_builder.py cloud_catalog_builder.py
          fi
          if [ -f ".github/requirements.txt" ] && [ ! -f "requirements.txt" ]; then
            git mv .github/requirements.txt requirements.txt || cp .github/requirements.txt requirements.txt
          fi
          python3 cloud_catalog_builder.py

      - name: Commit and push changes
        run: |
          git config user.name "modeoplus-bot"
          git config user.email "bot@modeoplus.cloud"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-sync catalog and move files to root"
          git push
